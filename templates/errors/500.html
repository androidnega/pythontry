{% extends 'base.html' %}
{% block title %}Something went wrong &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
  <p class="text-xs font-semibold uppercase tracking-[0.22em] text-red-400/90">500</p>
  <h1 class="font-serif-news mt-2 text-4xl font-semibold text-white">Something went wrong</h1>
  <p class="mt-3 text-slate-400">We're looking into it. Please try again in a moment.</p>
  <a href="{{ url_for('public.home') }}" class="mt-6 inline-block rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500">Go home</a>
</div>
{% endblock %}
