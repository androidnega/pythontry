{% extends 'base.html' %}
{% block title %}File too large &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
  <p class="text-xs font-semibold uppercase tracking-[0.22em] text-amber-400/90">413</p>
  <h1 class="font-serif-news mt-2 text-4xl font-semibold text-fg">File too large</h1>
  <p class="mt-3 text-muted">Uploads are limited to {{ limit_mb }} MB. Try a smaller file or embed a link instead.</p>
  <a href="{{ url_for('admin.dashboard') }}" class="mt-6 inline-block rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500">Back to admin</a>
</div>
{% endblock %}
